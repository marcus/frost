version: 2

project_name: frost

builds:
  - id: frost
    main: ./cmd/frost
    binary: frost
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/marcus/frost/pkg/buildinfo.Version=v{{ .Version }}
        -X github.com/marcus/frost/pkg/buildinfo.Commit={{ .Commit }}

  - id: catalog-build
    main: ./tools/catalog-build
    binary: catalog-build
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: release
    ids: [frost, catalog-build]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    wrap_in_directory: true
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - CONTRIBUTING.md
      - config/*
      - tools/catalog-build/overlay.json
      - tools/catalog-build/METRICS.md
      - tools/catalog-build/NOTICES.md
      - tools/catalog-build/licenses/*
      - examples/capacity/**

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

# Note: GoReleaser does NOT publish the Homebrew formula (there is intentionally
# no `brews:` block), the same as comms, td, and sidecar. Formula/frost.rb in
# marcus/homebrew-tap builds from source (to avoid Gatekeeper warnings on macOS)
# and is rendered by scripts/release-render-formula.sh, then published and
# verified by scripts/release-tap.sh (`make release-tap`) after the tagged
# GitHub release exists.
