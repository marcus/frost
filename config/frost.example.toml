# Typed decisions over supplied state. Disabled until a concrete
# decision-shaped journey needs it; it has no reasoning effort and no prior.
[[profiles]]
id = "jev-typed-decision"
label = "Jev typed decision"
model = "jev-1.13.0"
access_surface = "typesafe-api"
enabled = false
output_contracts = ["typed_decision"]
effort_mode = "none"
mapping_verified = false
latency_class = "extra_fast"

# Quota pools are declared here and observed by an external snapshot
# (examples/capacity/refresh.sh). The snapshot cannot add pools or windows.
# Window IDs follow CodexBar's names; verify a binding with
# `frost capacity check` before setting mapping_verified = true.

# Codex is a flat weekly limit; CodexBar's null five-hour window is dropped.
[[pools]]
id = "codex-main"
kind = "subscription"
marginal_cost = "included"
mapping_verified = true
required_window_ids = ["secondary"]
expiry_preference_window_ids = ["secondary"]
non_rollover_window_ids = ["secondary"]

# Claude Code: five-hour blocks under a weekly limit.
[[pools]]
id = "claude-main"
kind = "subscription"
marginal_cost = "included"
mapping_verified = true
required_window_ids = ["primary", "secondary"]
expiry_preference_window_ids = ["secondary"]
non_rollover_window_ids = ["primary", "secondary"]

# Fable draws from the Claude pool and its own weekly allowance.
[[pools]]
id = "claude-fable"
kind = "subscription"
marginal_cost = "included"
mapping_verified = true
required_window_ids = ["claude-weekly-scoped-fable"]
expiry_preference_window_ids = ["claude-weekly-scoped-fable"]
non_rollover_window_ids = ["claude-weekly-scoped-fable"]

# OpenCode Go reports five-hour, weekly, and monthly windows as estimates.
[[pools]]
id = "opencode-go"
kind = "subscription"
marginal_cost = "included"
mapping_verified = true
required_window_ids = ["primary", "secondary", "tertiary"]
expiry_preference_window_ids = ["secondary", "tertiary"]
non_rollover_window_ids = ["primary", "secondary", "tertiary"]

# Codex Spark has separate windows; which native models draw from it is
# unverified, so the binding stays unknown until confirmed.
[[pools]]
id = "codex-spark"
kind = "subscription"
marginal_cost = "included"
mapping_verified = false
required_window_ids = ["codex-spark", "codex-spark-weekly"]
expiry_preference_window_ids = ["codex-spark-weekly"]
non_rollover_window_ids = ["codex-spark", "codex-spark-weekly"]
