# Frost operator configuration: what you can actually run, and how to choose.
# Relative paths resolve against this file's directory.
#
# Every quality and cost number here is an operator prior: an ordinal
# impression, labeled as such in every result. Nothing in this file is a
# measurement. See config/README.md.

schema_version = 1
catalog_file = "catalog.example.json"
# Optional default usage snapshot written by an external producer (see
# examples/capacity). A missing file is a note, not an error.
capacity_file = "capacity.json"

[analyzer]
provider = "typesafe"
model = "jev-1.13.0"
questions_file = "questions-v3.json"
api_key_env = "TYPESAFE_API_KEY"
timeout_seconds = 45

[policy]
mode = "adequate"
uncertain_reasoning_quantile = 0.8
task_family_margin = 0.15
missing_context_threshold = 0.65
capability_threshold = 0.7
consequence_review_threshold = 1.5
large_workload_threshold = 2.5
effort_by_level = ["low", "medium", "high", "high", "xhigh"]
relaxed_level_reduction = 1
# Reasoning level -> worst acceptable operator quality rank. Level 0 admits
# everything; level 4 admits only rank 1.
prior_max_quality_rank_by_level = [9, 4, 3, 2, 1]

# Measured adequacy rules replace the prior for their task family and levels
# once the catalog carries the metric (see tools/catalog-build/METRICS.md).
# Both rules below are enabled. Their thresholds are PROVISIONAL placeholders
# chosen so that, on the September 2026 SWE-bench Verified board, the top
# tier passes level 3 and mid-tier models pass level 2; they are not
# calibrated against paired outcomes. profile_match = "any" is deliberate:
# SWE-bench harnesses are research agents, not the operator's CLI, so an
# exact harness match would never fire. When the catalog has no matching
# measurement for a profile, on_missing falls through to the operator prior.
[[policy.adequacy_rules]]
id = "swebench-software-change-l2"
task_family = "software_change"
reasoning_levels = [1, 2]
metric = "swebench.verified.resolve_rate"
metric_version = "verified-2024-08"
minimum = 0.60
profile_match = "any"
on_missing = "provisional_only"

[[policy.adequacy_rules]]
id = "swebench-software-change-l3"
task_family = "software_change"
reasoning_levels = [3, 4]
metric = "swebench.verified.resolve_rate"
metric_version = "verified-2024-08"
minimum = 0.72
profile_match = "any"
on_missing = "provisional_only"

# Quality rank: lower is better. Cost rank: higher is cheaper.

[policy.capacity]
# Fresh, applicable, exact (or opted-in estimated) observations decide
# availability among adequate profiles; they never move the quality floor.
prefer_expiring_included_usage = true
expiry_horizon_hours = 24
reserve_percent = 5
max_snapshot_age_minutes = 15
# OpenCode Go only reports estimates; counting them is deliberate here so
# DeepSeek keeps winning easy tasks. The code default is false.
allow_estimated_measurements = true
# true: a fresh, exhausted required pool excludes the profile; false: it is
# demoted within its tie group. Override per call with --availability.
enforce_availability = true


[[profiles]]
id = "fable"
pool_ids = ["claude-main", "claude-fable"]
label = "Fable"
model = "fable"
access_surface = "claude-code"
enabled = true
capabilities = ["repository_tools", "web_research", "image_input"]
effort_mode = "configurable"
effort_options = ["low", "medium", "high", "xhigh"]
mapping_verified = false
latency_class = "slow"
[profiles.prior]
quality_rank = 1
cost_rank = 1

